[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "luupy2d"
version = "0.0.1"
description = "Um Framework pedagógico para suporte ao aprendizado de programação através da criação de jogos 2D"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pygame-ce>=2.5.7"
]

[tool.hatch.build.targets.wheel]
packages = ["src/luupy2d"]

[project.scripts]
luupy2d = "luupy2d.luupy2d:main"
